name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Création du projet Android natif (Wrapper WebView)
        run: |
          mkdir -p app/src/main/java/com/sharenode/p2p
          mkdir -p app/src/main/assets/www

          cp index.html app/src/main/assets/www/
          [ -f sw.js ] && cp sw.js app/src/main/assets/www/ || true
          [ -f manifest.json ] && cp manifest.json app/src/main/assets/www/ || true
          [ -f icon-192.png ] && cp icon-192.png app/src/main/assets/www/ || true
          [ -f icon-512.png ] && cp icon-512.png app/src/main/assets/www/ || true

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ShareNodeP2P"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sharenode.p2p'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sharenode.p2p"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_share"
                  android:label="ShareNode P2P"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sharenode/p2p/MainActivity.java <<'EOF'
          package com.sharenode.p2p;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private byte[] pendingData;
              private static final int PERMISSION_REQUEST_CODE = 100;

              private static final String JS =
                  "(function(){"
                  + "if(window.__sv){return;}window.__sv=true;"
                  + "function ok(a){return a&&a.href&&(a.href.indexOf('blob:')===0||a.href.indexOf('data:')===0)&&a.hasAttribute('download');}"
                  + "function save(a){var n=a.getAttribute('download')||'export.json';"
                  + "fetch(a.href).then(function(r){return r.blob();}).then(function(b){"
                  + "var f=new FileReader();f.onload=function(){var d=String(f.result);"
                  + "AndroidBridge.saveFile(n,b.type||'',d.substring(d.indexOf(',')+1));};"
                  + "f.readAsDataURL(b);});}"
                  + "var oc=HTMLAnchorElement.prototype.click;"
                  + "HTMLAnchorElement.prototype.click=function(){if(ok(this)){save(this);return;}return oc.apply(this,arguments);};"
                  + "document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a'):null;if(ok(a)){e.preventDefault();save(a);}},true);"
                  + "})();";

              private String mimeFor(String name, String m) {
                  String n = name.toLowerCase();
                  if (n.endsWith(".json")) return "application/json";
                  if (n.endsWith(".csv")) return "text/csv";
                  if (n.endsWith(".txt") || n.endsWith(".log")) return "text/plain";
                  return (m == null || m.isEmpty()) ? "application/octet-stream" : m;
              }

              class Bridge {
                  @JavascriptInterface
                  public void saveFile(final String name, final String mime, final String b64) {
                      try {
                          pendingData = Base64.decode(b64, Base64.DEFAULT);
                      } catch (Exception e) {
                          return;
                      }
                      final String type = mimeFor(name, mime);
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType(type);
                          i.putExtra(Intent.EXTRA_TITLE, name);
                          startActivityForResult(i, 3);
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED ||
                      ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{
                              Manifest.permission.CAMERA,
                              Manifest.permission.READ_EXTERNAL_STORAGE,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE}, PERMISSION_REQUEST_CODE);
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(JS, null);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, "Choisir un fichier"), 2);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/assets/www/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 2) {
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(
                              WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                          filePathCallback = null;
                      }
                  } else if (requestCode == 3) {
                      if (resultCode == RESULT_OK && data != null && data.getData() != null && pendingData != null) {
                          try (OutputStream os = getContentResolver().openOutputStream(data.getData())) {
                              os.write(pendingData);
                              Toast.makeText(this, "Fichier enregistré", Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(this, "Erreur d'enregistrement", Toast.LENGTH_LONG).show();
                          }
                      }
                      pendingData = null;
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQUEST_CODE) {
                      if (webView != null) webView.reload();
                  }
              }
          }
          EOF

      - name: Compilation de l'APK
        run: gradle assembleDebug --stacktrace

      - name: Téléversement de l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: ShareNodeP2P-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
